# Calm, local-only theme. Built-in fonts need no external font service.
[theme]
base = "light"
primaryColor = "#24584B"
backgroundColor = "#F5F7F4"
secondaryBackgroundColor = "#EDF2EC"
textColor = "#233D34"
borderColor = "#DCE5DF"
grayColor = "#5E717C"
grayTextColor = "#526571"
linkColor = "#24584B"
font = "sans-serif"
headingFont = "sans-serif"
baseFontSize = 16
headingFontSizes = ["2rem", "1.5rem", "1.15rem", "1rem", "1rem", "1rem"]
headingFontWeights = [650, 600, 600, 600, 600, 600]
baseRadius = "12px"
buttonRadius = "11px"
showWidgetBorder = true
showSidebarBorder = true
dataframeHeaderBackgroundColor = "#E9EEF0"
dataframeBorderColor = "#CCD7DD"
blueColor = "#356B70"
blueTextColor = "#2C5C61"
blueBackgroundColor = "#E5EFF0"
greenColor = "#47735D"
greenTextColor = "#345B48"
greenBackgroundColor = "#E8F0EA"
yellowColor = "#A37C33"
yellowTextColor = "#73571F"
yellowBackgroundColor = "#F4EFE3"
redColor = "#A85252"
redTextColor = "#864141"
redBackgroundColor = "#F5EAEA"

[theme.sidebar]
backgroundColor = "#E9EEF0"
secondaryBackgroundColor = "#F5F7F8"
textColor = "#253744"
borderColor = "#CCD7DD"

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
